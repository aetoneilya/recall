# /etc/nginx/conf.d/recall.conf, rendered by enable-https.sh (__DOMAIN__,
# __RELAY_IP__). Traffic arrives from a TCP front proxy that routes by SNI and
# speaks PROXY protocol. Certificate: acme.sh standalone into /root/cert/recall/.
server {
    listen 8444 ssl http2 proxy_protocol;
    set_real_ip_from __RELAY_IP__;
    real_ip_header proxy_protocol;

    server_name __DOMAIN__;

    ssl_certificate /root/cert/recall/fullchain.pem;
    ssl_certificate_key /root/cert/recall/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_protocol_addr;
        proxy_set_header X-Real-IP $proxy_protocol_addr;
    }

    # Streamable HTTP may answer with SSE; don't buffer it.
    location /mcp {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_protocol_addr;
        proxy_set_header X-Real-IP $proxy_protocol_addr;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
